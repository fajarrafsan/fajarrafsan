name: Generate Trophy Card

on:
  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    timeout-minutes: 5

    steps:
      - name: Generate trophy.svg
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: ${{ github.repository_owner }}
          output_path: dist/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          theme: dracula
          max-rows: 1
          margin-width: 8
          margin-height: 8
          no-background: false
          no-frame: false

      - name: Check generated file
        run: |
          echo "Generated files:"
          find dist -type f -maxdepth 2 -print

      - name: Publish trophy.svg
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: trophy-output
          build_dir: dist
          commit_message: "Update trophy card"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
