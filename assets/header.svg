<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img" aria-labelledby="title desc">
  <title id="title">Fajar Rafsan - Fullstack Developer, Bandung</title>
  <desc id="desc">GitHub profile banner. Java, Spring, React, TypeScript. bit - small beginnings, big impacts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1220"/>
      <stop offset="55%" stop-color="#070B12"/>
      <stop offset="100%" stop-color="#0C1020"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="28%" r="42%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#38BDF8" opacity="0.16"/>
    </pattern>
    <clipPath id="card">
      <rect width="1100" height="300" rx="22"/>
    </clipPath>
    <style>
      .flow { stroke-dasharray: 5 7; animation: dash 10s linear infinite; }
      .pulse { animation: pulse 3.2s ease-in-out infinite; }
      .pulse2 { animation: pulse 3.2s ease-in-out 0.8s infinite; }
      .pulse3 { animation: pulse 3.2s ease-in-out 1.6s infinite; }
      @keyframes dash { to { stroke-dashoffset: -120; } }
      @keyframes pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1100" height="300" fill="url(#bg)"/>
    <rect width="1100" height="300" fill="url(#glow)"/>
    <rect width="1100" height="300" fill="url(#grid)"/>
    <rect width="1100" height="3" fill="url(#accent)"/>
    <rect x="0" y="36" width="5" height="228" fill="url(#accent)"/>
  </g>
  <rect x="0.75" y="0.75" width="1098.5" height="298.5" rx="21.25" fill="none" stroke="#1E2D45" stroke-width="1.5"/>

  <text x="36" y="48" fill="#64748B" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" letter-spacing="3.2">01  /  FR</text>
  <text x="1064" y="48" text-anchor="end" fill="#94A3B8" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" letter-spacing="2.4">BANDUNG  |  ID</text>

  <text x="36" y="118" fill="#F8FAFC" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="-1.2">FAJAR RAFSAN</text>
  <text x="36" y="154" fill="#38BDF8" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="6.5">FULLSTACK DEVELOPER.</text>

  <text x="36" y="198" fill="#CBD5E1" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15">Java/Spring yang andal di belakang. React yang jelas di depan.</text>

  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.6">
    <rect x="36" y="218" width="62" height="24" rx="12" fill="#0F1A2C" stroke="#334155"/>
    <text x="67" y="234" text-anchor="middle" fill="#E2E8F0">Java</text>
    <rect x="106" y="218" width="92" height="24" rx="12" fill="#0F1A2C" stroke="#334155"/>
    <text x="152" y="234" text-anchor="middle" fill="#E2E8F0">Spring Boot</text>
    <rect x="206" y="218" width="78" height="24" rx="12" fill="#0F1A2C" stroke="#334155"/>
    <text x="245" y="234" text-anchor="middle" fill="#E2E8F0">React 19</text>
    <rect x="292" y="218" width="92" height="24" rx="12" fill="#0F1A2C" stroke="#334155"/>
    <text x="338" y="234" text-anchor="middle" fill="#E2E8F0">TypeScript</text>
    <rect x="392" y="218" width="92" height="24" rx="12" fill="#0F1A2C" stroke="#334155"/>
    <text x="438" y="234" text-anchor="middle" fill="#E2E8F0">PostgreSQL</text>
  </g>

  <text x="36" y="272" fill="#64748B" font-family="Georgia, Times New Roman, serif" font-size="13" font-style="italic">bit - small beginnings, big impacts.</text>

  <g transform="translate(742, 78)">
    <path class="flow" d="M96 28 H118" stroke="#38BDF8" stroke-width="1.4" opacity="0.7"/>
    <path class="flow" d="M214 28 H256" stroke="#818CF8" stroke-width="1.4" opacity="0.7"/>
    <path class="flow" d="M166 48 V98" stroke="#38BDF8" stroke-width="1.4" opacity="0.55"/>
    <path class="flow" d="M304 48 V98" stroke="#818CF8" stroke-width="1.4" opacity="0.55"/>
    <path class="flow" d="M214 118 H256" stroke="#64748B" stroke-width="1.2" opacity="0.5"/>

    <g class="pulse">
      <rect x="0" y="8" width="96" height="40" rx="8" fill="#0F1A2C" stroke="#38BDF8"/>
      <text x="48" y="33" text-anchor="middle" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">CLIENT</text>
    </g>
    <g class="pulse2">
      <rect x="118" y="8" width="96" height="40" rx="8" fill="#0F1A2C" stroke="#38BDF8"/>
      <text x="166" y="33" text-anchor="middle" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">GATEWAY</text>
    </g>
    <g class="pulse3">
      <rect x="256" y="8" width="96" height="40" rx="8" fill="#0F1A2C" stroke="#818CF8"/>
      <text x="304" y="33" text-anchor="middle" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">SERVICE</text>
    </g>
    <rect x="118" y="98" width="96" height="40" rx="8" fill="#0F1A2C" stroke="#334155"/>
    <text x="166" y="123" text-anchor="middle" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">REDIS</text>
    <rect x="256" y="98" width="96" height="40" rx="8" fill="#0F1A2C" stroke="#334155"/>
    <text x="304" y="123" text-anchor="middle" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">POSTGRES</text>
  </g>
</svg>
